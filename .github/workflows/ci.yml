# CI：每次 push、開 PR 時自動跑
# - backend：單元測試（需要真實資料庫的整合測試沒設 TEST_* 環境變數會自動略過）
# - frontend：TypeScript 型別檢查＋建置
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"          # 跟 backend/Dockerfile 一致
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-mcp.txt

      # 分兩次裝：requirements.txt 固定 idna==3.17，mcp 需要較新的 idna，
      # 先裝後端套件、再裝 mcp 讓它升級 idna（跟本機 conda 環境的安裝順序一樣）
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-mcp.txt pytest==9.2.0

      - name: Run tests
        run: python -m pytest tests -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check and build
        run: npm run build
