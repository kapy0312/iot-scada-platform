services:

  backend:
    build: ./backend
    container_name: iot-backend
    ports:
      - "8000:8000"
    environment:
      # 密碼來自 repo 根目錄的 .env；沒設定時 docker compose 會直接報錯，不會用空密碼啟動
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@host.docker.internal:5435/iotscada
      QDRANT_URL: http://host.docker.internal:6343
      # 手冊向量查詢用哪一邊：qdrant（預設）或 pgvector；上傳、刪除、勾選兩邊都寫（Phase 2 過渡期）
      RAG_BACKEND: ${RAG_BACKEND:-qdrant}
      OLLAMA_URL: http://100.89.23.28:11434
      PLC_SOURCE: opcua
      # PLC 位址與寫入資料用的 device_id：在 .env 切換 PLCSIM／實機，不用改這個檔案
      # 接 PLCSIM 用 -SIM（模擬資料不會進入自動再訓練）；接實機改成 S7-1511T
      PLC_URL: ${PLC_URL:-opc.tcp://192.168.0.10:4840}
      OPCUA_DEVICE_ID: ${OPCUA_DEVICE_ID:-S7-1511T-SIM}
      # 允許呼叫 API 的前端網址（逗號分隔）；用 Tailscale IP 開前端時要加上那個網址
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # 雲端同步（Phase 1）：.env 設 CLOUD_SYNC_ENABLED=true 並填 TIGER_EDGE_URL 才會啟動
      CLOUD_SYNC_ENABLED: ${CLOUD_SYNC_ENABLED:-false}
      TIGER_EDGE_URL: ${TIGER_EDGE_URL:-}
      SYNC_EXCLUDE_SUFFIXES: ${SYNC_EXCLUDE_SUFFIXES:--MOCK}
      # 以下是 .env 的選填設定；沒設定時用 :- 後面的預設值（跟程式裡的預設一樣）
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SHIFT_TZ: ${SHIFT_TZ:-Asia/Taipei}
      RECOVERY_MIN_SECONDS: ${RECOVERY_MIN_SECONDS:-30}
      RECOVERY_MAX_SECONDS: ${RECOVERY_MAX_SECONDS:-120}
      TREND_WINDOW_MINUTES: ${TREND_WINDOW_MINUTES:-10}
      TREND_MIN_MINUTES: ${TREND_MIN_MINUTES:-5}
      TREND_HORIZON_MINUTES: ${TREND_HORIZON_MINUTES:-60}
      TREND_ON_COUNT: ${TREND_ON_COUNT:-3}
      TREND_OFF_COUNT: ${TREND_OFF_COUNT:-6}
    volumes:
      - ./backend/models:/app/models

  frontend:
    build: ./frontend
    container_name: iot-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
