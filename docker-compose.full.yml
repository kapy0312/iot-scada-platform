services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      POSTGRES_PASSWORD: iotscada123
      POSTGRES_DB: iotscada
    ports:
      - "5435:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: iot-backend
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - qdrant
    environment:
      DATABASE_URL: postgresql://postgres:iotscada123@timescaledb:5432/iotscada
      QDRANT_URL: http://qdrant:6333

  frontend:
    build: ./frontend
    container_name: iot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  timescale_data:
  qdrant_data: