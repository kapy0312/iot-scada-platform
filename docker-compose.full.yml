services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      # 只在資料庫第一次建立時生效；之後要換密碼請用 ALTER USER（見 README「設定 .env」）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: iotscada
    ports:
      - "5435:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6343:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: iot-backend
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - qdrant
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@timescaledb:5432/iotscada
      QDRANT_URL: http://qdrant:6333
      # 手冊向量查詢用哪一邊：qdrant（預設）或 pgvector；上傳、刪除、勾選兩邊都寫（Phase 2 過渡期）
      RAG_BACKEND: ${RAG_BACKEND:-qdrant}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      CLOUD_SYNC_ENABLED: ${CLOUD_SYNC_ENABLED:-false}
      TIGER_EDGE_URL: ${TIGER_EDGE_URL:-}
      SYNC_EXCLUDE_SUFFIXES: ${SYNC_EXCLUDE_SUFFIXES:--MOCK}

  frontend:
    build: ./frontend
    container_name: iot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  timescale_data:
  qdrant_data: