services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    environment:
      # 只在資料庫第一次建立時生效；之後要換密碼請用 ALTER USER（見 README「設定 .env」）
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: iotscada
    ports:
      - "5435:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6343:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    container_name: iot-backend
    ports:
      - "8000:8000"
    depends_on:
      - timescaledb
      - qdrant
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}@timescaledb:5432/iotscada
      QDRANT_URL: http://qdrant:6333

  frontend:
    build: ./frontend
    container_name: iot-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  timescale_data:
  qdrant_data: